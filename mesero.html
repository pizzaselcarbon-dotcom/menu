<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meseros</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f6f6f4;color:#222;padding-bottom:80px}
header{background:#1f6f43;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}header b{font-size:19px}header small{display:block;opacity:.9}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:12px}.tb{border:2px solid #1f6f43;background:#fff;border-radius:12px;padding:18px 6px;font-size:16px}.tb.oc{background:#fde8c8;border-color:#e08a00}.tb small{display:block;color:#a35f00}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;position:sticky;top:58px;z-index:4}.cats button{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:18px;padding:7px 13px}.cats .on,.op.on{background:#1f6f43;color:#fff;border-color:#1f6f43}
.it{display:flex;gap:10px;align-items:center;background:#fff;margin:8px 12px;padding:10px;border-radius:12px}.it .t{flex:1}.it span{color:#1f6f43;font-weight:600}
.btn,.it button{background:#1f6f43;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px}.it button:disabled{background:#bbb}.w{width:100%;margin-top:8px}
.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 12px;background:#fff;box-shadow:0 -2px 8px #0002}.bar .btn{width:100%;font-size:17px;padding:14px}
.sh{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.sh>div{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;max-width:560px;margin:auto auto 0}
.op{display:inline-block;margin:4px 6px 4px 0;padding:9px 13px;border:1px solid #ccc;border-radius:16px;background:#fff}
input,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccc;border-radius:8px;font:inherit}.r{display:flex;justify-content:space-between;padding:6px 0}.c{text-align:center;padding:40px 20px}.card{background:#fff;margin:12px;padding:14px;border-radius:12px}</style></head><body><div id="app"></div>
<script>
const DB='https://sistema-pos-eze-default-rtdb.firebaseio.com';
let M,MS,pin='',who='',mi=-1,cart=[],cat=0,pk=null,view='login',pg=-1,tm=0,co=false;
const $=s=>document.querySelector(s),fmt=n=>'$'+Math.round(n).toLocaleString('es-CO'),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return''}};
const j=async(p,o)=>{const r=await fetch(DB+'/'+p+'.json',o);if(!r.ok)throw 0;return r.json()};
const mesa=()=>(MS&&MS.tables||[])[mi],acc=()=>((MS&&MS.cuentas)||[]).find(c=>c.mesa==mesa()),tot=()=>cart.reduce((s,l)=>s+l.price*l.qty,0);
async function init(){pin=ls('pin');who=ls('who');if(!pin||!who){view='login';draw();return}
try{M=await j('menu');MS=await j('mesas')}catch(e){}
if(!M||!MS){$('#app').innerHTML='<p class="c">No se pudo cargar.<br><br><button class="btn" onclick="init()">Reintentar</button></p>';return}
view='mesas';draw();if(!tm)tm=setInterval(async()=>{try{MS=await j('mesas');if(view=='mesas'||view=='cuenta')draw()}catch(e){}},5000)}
function login(){const n=$('#nm').value.trim(),p=$('#pn').value.trim();if(!n||!p)return;ls('who',n);ls('pin',p);init()}
function logout(){ls('pin','');ls('who','');location.reload()}
const hd=(t,s,b)=>`<header>${b?`<a href="#" onclick="${b};return false" style="color:#fff;text-decoration:none">← </a>`:''}<b>${t}</b><small>${s||''}</small></header>`;
function draw(){const V={
login:()=>`<div class="card"><b style="font-size:20px">Meseros</b><input id="nm" placeholder="Tu nombre"><input id="pn" type="password" inputmode="numeric" placeholder="PIN del restaurante"><button class="btn w" onclick="login()">Entrar</button></div>`,
mesas:()=>hd(esc(M.biz),'👤 '+esc(who)+' · <a href="#" style="color:#fff" onclick="logout();return false">salir</a>')+`<div class="g">${(MS.tables||[]).map((t,i)=>{const c=((MS.cuentas)||[]).find(x=>x.mesa==t);return`<button class="tb ${c?'oc':''}" onclick="mi=${i};view='cuenta';draw()">${esc(t)}<small>${c?fmt(c.total):'Libre'}</small></button>`}).join('')}</div>`,
cuenta:()=>{const c=acc();return hd(esc(mesa()),c?'Total '+fmt(c.total):'Mesa libre',"view='mesas';draw()")+`<div class="card">${c?c.lines.map(l=>`<div class="r"><span>${l.q}× ${esc(l.n)}${l.m?'<br><small>'+esc(l.m)+'</small>':''}</span><span>${fmt(l.p*l.q)}</span></div>`).join('')+`<div class="r"><b>Total (con impuesto)</b><b>${fmt(c.total)}</b></div>`:'Sin pedidos todavía.'}<button class="btn w" onclick="view='menu';draw()">➕ Agregar productos</button>${c?`<button class="btn w" style="background:#c0392b" onclick="pg=-1;view='cobro';draw()">💵 Cobrar</button>`:''}</div>`},
menu:()=>{const cs=M.cats.filter(c=>M.items.some(i=>i.cat==c)),its=M.items.filter(i=>i.cat==cs[cat]);return hd(esc(mesa()),'Agregar productos',"view='cuenta';draw()")+`<div class="cats">${cs.map((c,i)=>`<button class="${i==cat?'on':''}" onclick="cat=${i};draw()">${esc(c)}</button>`).join('')}</div>${its.map(i=>{const a=i.stock!=null&&i.stock<=0;return`<div class="it"><div class="t"><b>${esc(i.emoji)} ${esc(i.name)}</b><br><span>${fmt(i.price)}</span></div><button ${a?'disabled':''} onclick="add(${i.id})">${a?'Agotado':'Agregar'}</button></div>`}).join('')}${cart.length?`<div class="bar"><button class="btn" onclick="co=true;draw()">Revisar y enviar · ${cart.reduce((s,l)=>s+l.qty,0)} · ${fmt(tot())}</button></div>`:''}${pk?pickH():''}${co?coH():''}`},
cobro:()=>{const c=acc();if(!c)return V.cuenta();const P=MS.pays||['Efectivo'];return hd('Cobrar '+esc(mesa()),'',"view='cuenta';draw()")+`<div class="card"><div class="r"><b>Total</b><b style="font-size:22px">${fmt(c.total)}</b></div>${P.map((p,i)=>`<span class="op ${pg==i?'on':''}" onclick="pg=${i};draw()">${esc(p)}</span>`).join('')}${P[pg]=='Efectivo'?'<input id="rc" type="number" inputmode="numeric" placeholder="Efectivo recibido (opcional)">':''}<button class="btn w" id="cb" onclick="cobrar()">Confirmar cobro</button></div>`}};
$('#app').innerHTML=V[view]()}
function add(id){const it=M.items.find(i=>i.id==id);if((it.mods||[]).some(m=>m.opts.length)){pk={it,sel:{}};draw()}else put(it,[],0)}
function put(it,names,x){const key=it.id+'|'+names.join(','),l=cart.find(c=>c.key==key);l?l.qty++:cart.push({id:it.id,key,name:it.name,mods:names,price:it.price+x,qty:1});pk=null;draw()}
function pickH(){const{it,sel}=pk;return`<div class="sh"><div><b style="font-size:18px">${esc(it.name)}</b>${it.mods.filter(m=>m.opts.length).map((m,g)=>`<p><b>${esc(m.name)}</b><br>${m.opts.map((o,k)=>`<span class="op ${sel[g]===k?'on':''}" onclick="pk.sel[${g}]=pk.sel[${g}]===${k}?undefined:${k};draw()">${esc(o.n)}${o.p?' +'+fmt(o.p):''}</span>`).join('')}</p>`).join('')}<button class="btn w" onclick="okPick()">Agregar</button><button class="btn w" style="background:#888" onclick="pk=null;draw()">Cancelar</button></div></div>`}
function okPick(){const{it,sel}=pk,ms=it.mods.filter(m=>m.opts.length),ch=Object.keys(sel).filter(g=>sel[g]!==undefined).map(g=>ms[g].opts[sel[g]]);put(it,ch.map(o=>o.n),ch.reduce((s,o)=>s+(+o.p||0),0))}
function q(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);if(!cart.length)co=false;draw()}
function coH(){return`<div class="sh"><div><b style="font-size:18px">Pedido · ${esc(mesa())}</b>${cart.map((l,i)=>`<div class="r"><span>${esc(l.name)}${l.mods.length?'<br><small>'+esc(l.mods.join(', '))+'</small>':''}</span><span><button onclick="q(${i},-1)">−</button> ${l.qty} <button onclick="q(${i},1)">+</button></span></div>`).join('')}<textarea id="nt" rows="2" placeholder="Notas para cocina"></textarea><button class="btn w" id="sb" onclick="send()">Enviar a cocina</button><button class="btn w" style="background:#888" onclick="co=false;draw()">Seguir agregando</button></div></div>`}
async function send(){const b=$('#sb');b.disabled=true;b.textContent='Enviando…';try{await j('pedidos',{method:'POST',body:JSON.stringify({tipo:'mesero',mesa:mesa(),mesero:who,pin,nota:$('#nt').value.trim(),lines:cart.map(l=>({id:l.id,mods:l.mods,qty:l.qty})),at:Date.now()})});cart=[];co=false;view='cuenta';draw();alert('✅ Enviado a cocina')}catch(e){alert('No se pudo enviar. Intenta de nuevo.');b.disabled=false;b.textContent='Enviar a cocina'}}
async function cobrar(){const c=acc(),P=MS.pays||['Efectivo'];if(!c||pg<0)return alert('Elige la forma de pago');const rc=+($('#rc')||{}).value||0;if(P[pg]=='Efectivo'&&rc&&rc<c.total)return alert('El efectivo es menor al total');
const b=$('#cb');b.disabled=true;b.textContent='Procesando…';
try{const k=(await j('pedidos',{method:'POST',body:JSON.stringify({tipo:'cobro',mesa:mesa(),total:c.total,metodo:P[pg],recibido:rc||c.total,mesero:who,pin,at:Date.now()})})).name;
for(let i=0;i<15;i++){await new Promise(r=>setTimeout(r,2000));const x=await j('resp/'+k);if(x){if(x.ok){$('#app').innerHTML=`<p class="c" style="font-size:20px">✅<br><b>${esc(x.msg)}</b>${x.change>0?'<br>Cambio: <b>'+fmt(x.change)+'</b>':''}</p><p class="c"><button class="btn" onclick="view='mesas';init()">Volver a las mesas</button></p>`}else{alert(x.msg);b.disabled=false;b.textContent='Confirmar cobro'}return}}
alert('La caja no respondió. Verifica que esté abierta y con internet antes de reintentar.');b.disabled=false;b.textContent='Confirmar cobro'}catch(e){alert('Error de conexión');b.disabled=false;b.textContent='Confirmar cobro'}}
init();
</script></body></html>
