<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menú</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f6f6f4;color:#222;padding-bottom:80px}
header{background:#c0392b;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}header b{font-size:19px}header small{display:block;opacity:.9}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;position:sticky;top:58px;z-index:4}.cats button{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:18px;padding:7px 13px;font-size:14px}.cats .on{background:#c0392b;color:#fff;border-color:#c0392b}
.it{display:flex;gap:12px;align-items:center;background:#fff;margin:8px 12px;padding:10px;border-radius:12px;box-shadow:0 1px 3px #0001}.it .im{width:72px;height:72px;border-radius:10px;background:#f0ece6;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;flex:none}.it img{width:100%;height:100%;object-fit:cover}.it div.t{flex:1}.it b{display:block}.it span{color:#c0392b;font-weight:600}
.it button,.btn{background:#c0392b;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}.it button:disabled{background:#bbb}
.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 12px;background:#fff;box-shadow:0 -2px 8px #0002}.bar .btn{width:100%;font-size:17px;padding:14px}
.sh{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.sh>div{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;max-width:560px;margin:auto auto 0}
.op{display:inline-block;margin:4px 6px 4px 0;padding:8px 12px;border:1px solid #ccc;border-radius:16px;background:#fff}.op.on{background:#c0392b;color:#fff;border-color:#c0392b}
input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccc;border-radius:8px;font:inherit}.r{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.r button{border:1px solid #ccc;background:#fff;border-radius:6px;width:30px;height:30px}
.c{text-align:center;padding:40px 20px}</style></head><body><div id="app"><p class="c">Cargando menú…</p></div>
<script>
const DB='https://sistema-pos-eze-default-rtdb.firebaseio.com'; // <<< EDITAR: URL de tu Realtime Database
const P=new URLSearchParams(location.search),MESA=P.get('mesa');
let M,cart=[],cat='',pk=null,co=false;
const $=s=>document.querySelector(s),fmt=n=>'$'+Math.round(n).toLocaleString('es-CO'),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tot=()=>cart.reduce((s,l)=>s+l.price*l.qty,0),cnt=()=>cart.reduce((s,l)=>s+l.qty,0);
async function init(){try{M=await(await fetch(DB+'/menu.json')).json();if(!M)throw 0;cat=M.cats[0]||'';draw();loadImgs()}catch(e){$('#app').innerHTML='<p class="c">No se pudo cargar el menú. Intenta de nuevo.</p>'}}
async function loadImgs(){for(const i of M.items)if(i.img)fetch(DB+'/img/'+i.id+'.json').then(r=>r.json()).then(s=>{const e=document.getElementById('im'+i.id);if(s&&e)e.innerHTML='<img src="'+s+'">';i.src=s}).catch(()=>{})}
function draw(){if(M.abierto===false){$('#app').innerHTML='<header><b>'+esc(M.biz)+'</b></header><p class="c">😴 Por ahora no estamos recibiendo pedidos en línea.</p>';return}
const its=M.items.filter(i=>i.cat==cat);
$('#app').innerHTML=`<header><b>${esc(M.biz)}</b><small>${MESA?'📍 '+esc(MESA):'🛵 Pedido a domicilio'}</small></header><div class="cats">${M.cats.filter(c=>M.items.some(i=>i.cat==c)).map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${esc(c).replace(/'/g,"\\'")}';draw()">${esc(c)}</button>`).join('')}</div>${its.map(i=>{const a=i.stock!=null&&i.stock<=0;return`<div class="it"><div class="im" id="im${i.id}">${i.src?'<img src="'+i.src+'">':esc(i.emoji)}</div><div class="t"><b>${esc(i.name)}</b><span>${fmt(i.price)}</span></div><button ${a?'disabled':''} onclick="add(${i.id})">${a?'Agotado':'Agregar'}</button></div>`}).join('')}${cnt()?`<div class="bar"><button class="btn" onclick="co=true;draw()">Ver pedido · ${cnt()} · ${fmt(tot())}</button></div>`:''}${pk?pickH():''}${co?coH():''}`}
function add(id){const it=M.items.find(i=>i.id==id);if((it.mods||[]).some(m=>m.opts.length)){pk={it,sel:{}};draw()}else put(it,[])}
function put(it,names,extra){const key=it.id+'|'+names.join(','),l=cart.find(x=>x.key==key);l?l.qty++:cart.push({id:it.id,key,name:it.name,mods:names,price:it.price+(extra||0),qty:1});pk=null;draw()}
function pickH(){const {it,sel}=pk;return`<div class="sh"><div><b style="font-size:18px">${esc(it.name)}</b>${it.mods.filter(m=>m.opts.length).map((m,g)=>`<p><b>${esc(m.name)}</b><br>${m.opts.map((o,j)=>`<span class="op ${sel[g]===j?'on':''}" onclick="pk.sel[${g}]=pk.sel[${g}]===${j}?undefined:${j};draw()">${esc(o.n)}${o.p?' +'+fmt(o.p):''}</span>`).join('')}</p>`).join('')}<button class="btn" style="width:100%" onclick="okPick()">Agregar</button> <button style="width:100%;margin-top:8px;border:0;background:none;padding:10px" onclick="pk=null;draw()">Cancelar</button></div></div>`}
function okPick(){const {it,sel}=pk,ms=it.mods.filter(m=>m.opts.length),ch=Object.keys(sel).filter(g=>sel[g]!==undefined).map(g=>ms[g].opts[sel[g]]);put(it,ch.map(o=>o.n),ch.reduce((s,o)=>s+(+o.p||0),0))}
function q(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);if(!cart.length)co=false;draw()}
function coH(){return`<div class="sh"><div><b style="font-size:18px">Tu pedido</b>${cart.map((l,i)=>`<div class="r"><span>${esc(l.name)}${l.mods.length?'<br><small>'+esc(l.mods.join(', '))+'</small>':''}</span><span><button onclick="q(${i},-1)">−</button> ${l.qty} <button onclick="q(${i},1)">+</button> ${fmt(l.price*l.qty)}</span></div>`).join('')}<div class="r"><b>Total${MESA?'':' (sin domicilio)'}</b><b>${fmt(tot())}</b></div>
<input id="nm" placeholder="Tu nombre${MESA?' (opcional)':''}">${MESA?'':'<input id="tl" type="tel" placeholder="Teléfono / WhatsApp"><input id="dr" placeholder="Dirección de entrega"><select id="pg"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select>'}<textarea id="nt" rows="2" placeholder="Notas (sin cebolla, etc.)"></textarea><button class="btn" style="width:100%" id="sb" onclick="send()">Enviar pedido</button><button style="width:100%;margin-top:8px;border:0;background:none;padding:10px" onclick="co=false;draw()">Seguir pidiendo</button></div></div>`}
async function send(){const v=id=>($('#'+id)||{value:''}).value.trim(),o={tipo:MESA?'mesa':'domicilio',mesa:MESA||'',cliente:v('nm'),tel:v('tl'),dir:v('dr'),pago:v('pg'),nota:v('nt'),lines:cart.map(l=>({id:l.id,name:l.name,mods:l.mods,qty:l.qty})),at:Date.now()};
if(!MESA&&(!o.cliente||!o.tel||!o.dir)){alert('Completa nombre, teléfono y dirección');return}
$('#sb').disabled=true;$('#sb').textContent='Enviando…';
try{const r=await fetch(DB+'/pedidos.json',{method:'POST',body:JSON.stringify(o)});if(!r.ok)throw 0;cart=[];co=false;$('#app').innerHTML='<p class="c" style="font-size:20px">✅<br><b>¡Pedido enviado!</b><br><br>Ya lo recibió la cocina.'+(MESA?'':'<br>Te contactaremos para confirmar el domicilio.')+'</p><p class="c"><button class="btn" onclick="init()">Hacer otro pedido</button></p>'}catch(e){alert('No se pudo enviar. Intenta de nuevo.');$('#sb').disabled=false;$('#sb').textContent='Enviar pedido'}}
init();
</script></body></html>
