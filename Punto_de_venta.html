*{box-sizing:border-box}html,body{height:100%;margin:0;touch-action:pan-x pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%}

else{const tt=t.lines.reduce((s,l)=>s+l.price*l.qty,0)*(1+S.tax/100);if(Math.round(tt)!=Math.round(+o.total))m='La cuenta cambió, revísala y vuelve a cobrar';else{S.onlSeen.push(k);m=onlPay(t,o.metodo,+o.recibido||tt)}}

const dom=(o.tipo!='mesa'&&o.tipo!='mesero')||!S.tables.includes(o.mesa);let t=dom?null:S.open.find(x=>x.mode==o.mesa);
if(t&&cur&&cur.id&&cur.id==t.id&&cur.lines.length)return false;
const ls=[];o.lines.forEach(l=>{const it=S.items.find(i=>i.id==l.id);if(!it)return;const os=(it.mods||[]).map(id=>S.mods.find(m=>m.id==id)).filter(Boolean).flatMap(m=>m.opts),nm=(l.mods||[]).filter(n=>os.some(x=>x.n==n));ls.push({id:it.id,key:it.id+'|'+nm.join(','),name:it.name,mods:nm,price:it.price+nm.reduce((s,n)=>s+(+os.find(x=>x.n==n).p||0),0),qty:Math.max(1,Math.min(50,Math.floor(+l.qty||1)))})});
if(!ls.length)return true;
const info=dom?'DOMICILIO - '+o.cliente+' · Tel '+o.tel+' · '+o.dir+' · Pago: '+o.pago:(o.tipo=='mesero'?'MESERO '+o.mesero:'PEDIDO QR'+(o.cliente?' ('+o.cliente+')':'')),nn=[info,o.nota].filter(Boolean).join(' | ');
if(!t){t={id:Date.now(),mode:dom?'Para llevar':o.mesa,name:dom?'Domicilio - '+String(o.cliente).slice(0,30):o.mesa,client:dom?o.cliente:'',note:'',lines:[],sent:{},at:Date.now()};S.open.push(t)}
ls.forEach(n=>{const e=t.lines.find(x=>(x.key||x.id)==n.key);e?e.qty+=n.qty:t.lines.push(n)});
const prev=t.note;t.note=nn;sendKitchen(t,true);if(!dom)t.note=prev;
S.onlSeen.push(k);S.onlSeen=S.onlSeen.slice(-100);save();onlBeep();note('📱 Pedido nuevo: '+(dom?'Domicilio':o.mesa));menu(false);if(view=='kitchen'||view=='tables')render();return true}
let onlM='',onlMB=false;
async function onlMesas(){if(!onlOK()||onlMB)return;onlMB=true;try{const cu=S.open.filter(t=>S.tables.includes(t.mode)&&t.lines.length).map(t=>({mesa:t.mode,total:Math.round(t.lines.reduce((s,l)=>s+l.price*l.qty,0)*(1+S.tax/100)),lines:t.lines.map(l=>({n:l.name,q:l.qty,p:l.price,m:(l.mods||[]).join(', ')}))})),d={tables:S.tables,pays:S.pays,cuentas:cu},h=JSON.stringify(d);if(h!=onlM){await onlDb('PUT','mesas',d);onlM=h}}catch(e){}finally{onlMB=false}}
function onlBeep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},500)}catch(e){}}
async function onlPoll(){if(!onlOK()||onlP)return;onlP=true;try{const d=await onlDb('GET','pedidos');if(d)for(const k of Object.keys(d))if(onlImport(d[k],k))await onlDb('DELETE','pedidos/'+k)}catch(e){}finally{onlP=false}}
function onlOpen(){const o=document.getElementById('onl');if(o)o.remove();const d=document.createElement('div');d.id='onl';d.style.cssText='position:fixed;inset:0;background:var(--bg);color:var(--tx);z-index:70;overflow:auto;padding:16px';document.body.appendChild(d);onlDraw()}
function onlDraw(){const c=S.onl,F=(k,l,t)=>`<div class="lbl" style="margin-top:10px">${l}</div><input type="${t||'text'}" value="${esc(c[k]||'')}" oninput="S.onl.${k}=this.value.trim();save()" style="width:100%;box-sizing:border-box;padding:10px;margin-top:4px">`;
document.getElementById('onl').innerHTML=`<div class="np"><div style="display:flex;justify-content:space-between"><b style="font-size:18px">📱 Menú digital y pedidos por QR</b><button onclick="document.getElementById('onl').remove()" style="font-size:20px">✕</button></div>
${F('url','Firebase: URL de la Realtime Database')}${F('key','Firebase: API Key (Configuración del proyecto)')}${F('email','Usuario (email) creado en Firebase Authentication')}${F('pass','Contraseña de ese usuario','password')}${F('pin','PIN de meseros (números, ej. 4821). Se pide en mesero.html')}${F('base','Link donde publicaste menu.html (ej: https://mi-menu.netlify.app/menu.html)')}
<div style="font-size:13px;opacity:.8;margin-top:6px">Link meseros: ${esc((c.base||'').replace(/[^/]*$/,'')+'mesero.html')}</div><label class="row" style="padding:12px 0"><span>Recibir pedidos en línea</span><input type="checkbox" ${c.on!==false?'checked':''} onchange="S.onl.on=this.checked;save();onlPublish().catch(()=>{})"></label>
<button class="btn" onclick="onlTest()">1. Publicar menú ahora</button> <button class="btn" onclick="onlQR()">2. Generar QR</button> <button class="btn" onclick="window.print()">3. Imprimir</button></div><div id="qrs" style="display:flex;flex-wrap:wrap;gap:14px;margin-top:16px"></div>`}
async function onlTest(){try{note('Publicando…');await onlPublish(true);note('✅ Menú publicado. Ya puedes generar los QR')}catch(e){note('Error: '+e.message)}}
function onlQR(){const c=S.onl,b=document.getElementById('qrs');if(!c.base){note('Escribe el link de tu menu.html');return}
const go=()=>{b.innerHTML='';[...S.tables,'Domicilio'].forEach(n=>{const u=c.base+(c.base.includes('?')?'&':'?')+(n=='Domicilio'?'tipo=domicilio':'mesa='+encodeURIComponent(n)),e=document.createElement('div');e.style.cssText='text-align:center;border:1px dashed #999;padding:10px;width:190px;page-break-inside:avoid';e.innerHTML='<b>'+esc(S.biz)+'</b><br><b>'+esc(n)+'</b><div style="display:flex;justify-content:center;margin:6px 0"></div><small>Escanea y haz tu pedido</small>';b.appendChild(e);new QRCode(e.children[3],{text:u,width:160,height:160})})};
window.QRCode?go():(()=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=go;s.onerror=()=>note('Sin internet para generar QR');document.head.appendChild(s)})()}
setInterval(()=>onlPoll(),5000);setInterval(()=>onlMesas(),5000);setInterval(()=>onlPublish().catch(()=>{}),60000);setTimeout(()=>onlPublish().catch(()=>{}),4000);
try{syncAll()}catch(e){}
render();
</script></body></html>
